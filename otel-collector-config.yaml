receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  
  mysql:
    endpoint: ht-mysql:3306
    username: myuser
    password: mypassword
    database: mydatabase
    collection_interval: 10s
    initial_delay: 1s    
    statement_events:
      digest_text_limit: 120
      time_limit: 24h
      limit: 250

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  
  batch:

exporters:
  debug:
    verbosity: detailed
  otlp:
    endpoint: "http://ht-jaeger:4317"
    tls:
      insecure: true

extensions:
  zpages:
    endpoint: 0.0.0.0:55679

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug,otlp]
    
    metrics:
      receivers: [otlp,mysql]
      processors: [batch]
      exporters: [debug]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  
  extensions: [zpages]

